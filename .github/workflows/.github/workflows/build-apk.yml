name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Unzip project
      run: |
        unzip -o acil-asistani--er-intern-companion.zip -d ./app-files
        if [ -d "./app-files/acil-asistani--er-intern-companion" ]; then
          cp -r ./app-files/acil-asistani--er-intern-companion/* ./
        else
          cp -r ./app-files/* ./
        fi

    - name: Set up Java JDK
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Build Web App to APK via Capacitor
      run: |
        npm install -g @capacitor/cli @capacitor/core @capacitor/android
        npx cap init "Acil Asistani" "com.eai.acilasistani" --web-dir .
        npx cap add android
        npx cap copy
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: acil-asistani-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk

name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup project structure
      run: |
        unzip -o *.zip -d ./app-files
        mkdir -p www
        
        # index.html dosyasının bulunduğu tam klasörü tespit et
        INDEX_PATH=$(find ./app-files -name "index.html" | head -n 1)
        INDEX_DIR=$(dirname "$INDEX_PATH")
        
        echo "Bulunan HTML Klasörü: $INDEX_DIR"
        
        # O klasördeki tüm içerikleri doğrudan www klasörüne kopyala
        cp -r "$INDEX_DIR"/* ./www/
        
        echo "--- WWW KLASÖRÜ İÇERİĞİ ---"
        ls -la ./www

    - name: Set up Java JDK
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Build Web App to APK via Capacitor
      run: |
        npm init -y
        npm install @capacitor/core @capacitor/cli @capacitor/android
        npx cap init "Acil Asistani" "com.eai.acilasistani" --web-dir www
        npx cap add android
        npx cap copy android
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: acil-asistani-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
